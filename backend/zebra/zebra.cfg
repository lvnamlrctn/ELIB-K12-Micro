# Cấu hình Zebra (Index Data) — server Z39.50 của ELIB.
#
# MỘT register duy nhất chứa NHIỀU database:
#   - 1 database GỘP        : toàn bộ biểu ghi của mọi đơn vị   (mặc định "ELIB")
#   - 1 database MỖI ĐƠN VỊ : chỉ biểu ghi của đơn vị đó         ("ELIB_<mã đơn vị>")
# Tên từng database KHÔNG khai báo ở đây — docker-entrypoint.sh truyền qua `zebraidx -d <tên>` lúc đánh
# chỉ mục, nên thêm đơn vị mới KHÔNG phải sửa file này (chỉ cần có thư mục mới trong /export).

profilePath: /zebra/tab:/usr/share/idzebra-2.0/tab
modulePath: /usr/lib/idzebra-2.0/modules

attset: bib1.att
attset: explain.att

# Đọc thẳng file MARC ISO2709 nhị phân do ZebraExportJob xuất ra, theo profile tab/elib.abs.
# Cần gói libidzebra-2.0-mod-grs-marc (đã cài trong Dockerfile).
recordType: grs.marc.elib

# Database mặc định khi client Z39.50 không chỉ định tên — trỏ về database gộp.
database: ELIB

register:  /var/lib/zebra/reg
shadow:    /var/lib/zebra/shadow
lockDir:   /var/lib/zebra/lock
setTmpDir: /var/lib/zebra/tmp
keyTmpDir: /var/lib/zebra/key

# storeData: 1 để zebrasrv trả lại nguyên bản ghi MARC gốc cho client (không phải dựng lại từ chỉ mục).
storeKeys: 1
storeData: 1
