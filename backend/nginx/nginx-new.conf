# Stack mới (5 đơn vị Bắc Ninh) + fallback về stack cũ cho tenant cũ

upstream api_new { server elibapi-new:8080; }
upstream ssr_new  { server admin-website-new:4000; }

upstream api_old  { server elibapi-internal:8080; }
upstream ssr_old  { server admin-website:4000; }

# ── 5 subdomain mới → stack mới ─────────────────────────────────────────────

server {
    listen 80;
    server_name thuvienbn1.thuvientn.vn xuancam.thuvientn.vn triqua.thuvientn.vn hiephoa.thuvientn.vn hopthinh.thuvientn.vn;
    client_max_body_size 50m;

    location /api/public { proxy_pass http://api_new; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
    location /api        { proxy_pass http://api_new; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
    location /hangfire   { proxy_pass http://api_new; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://ssr_new; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_cache_bypass $http_upgrade; proxy_read_timeout 60s; }
}

server {
    listen 443 ssl;
    server_name thuvienbn1.thuvientn.vn xuancam.thuvientn.vn triqua.thuvientn.vn hiephoa.thuvientn.vn hopthinh.thuvientn.vn;
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    client_max_body_size 50m;

    location /api/public { proxy_pass http://api_new; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
    location /api        { proxy_pass http://api_new; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
    location /hangfire   { proxy_pass http://api_new; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://ssr_new; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_cache_bypass $http_upgrade; proxy_read_timeout 60s; }
}

# ── Tất cả còn lại (thuvientn.vn + subdomain cũ) → stack cũ ────────────────

