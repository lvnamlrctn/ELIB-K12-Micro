# nginx trên máy DEV → gateway (127.0.0.1:10680). Đặt vào /etc/nginx/conf.d/ rồi: nginx -t && systemctl reload nginx.
# HTTPS: certbot --nginx -d elib-k12-micro.thuvientn.vn (certbot tự thêm khối 443 + chuyển hướng).
# Subdomain đơn vị (<truong>.elib-k12-micro.thuvientn.vn) cần DNS wildcard; TLS cho wildcard cần chứng chỉ DNS-01.
server {
    listen 80;
    listen [::]:80;
    server_name elib-k12-micro.thuvientn.vn *.elib-k12-micro.thuvientn.vn;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:10680;
        proxy_http_version 1.1;
        # Gateway xác định đơn vị theo Host — phải giữ nguyên.
        proxy_set_header Host $host;
        # GHI ĐÈ (không nối thêm) để client không chèn được IP giả vào X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE (chat AI, thông báo) về sau: không đệm phản hồi.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
