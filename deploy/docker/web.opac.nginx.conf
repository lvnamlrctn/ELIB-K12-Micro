# OPAC: SPA ở gốc host của đơn vị (gateway chuyển mọi đường dẫn không thuộc /api, /admin, /account, /connect, /s3… tới đây).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html/opac;

    # API/OIDC đi qua gateway cùng origin; style nội tuyến do Angular chèn cho component.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz { access_log off; return 200 "ok"; }

    # File build có hash trong tên (main-XXXX.js, media/*.woff2…): cache lâu. favicon/ảnh trong public không có hash → mặc định.
    location ~* \.(js|css|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Route của SPA → index.html (không cache để luôn lấy bản mới).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
