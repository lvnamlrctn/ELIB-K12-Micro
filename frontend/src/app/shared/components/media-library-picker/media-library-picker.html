@if (isOpen()) {
  <div class="fixed inset-0 z-[120] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl overflow-hidden max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
        <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <mat-icon class="text-emerald-600">perm_media</mat-icon>
          {{ 'MEDIA_LIBRARY.TITLE' | translate }}
        </h3>
        <button (click)="close()" class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="px-6 py-4 border-b border-gray-100">
        <div class="flex gap-2">
          <input [ngModel]="keyword()" (ngModelChange)="keyword.set($event)" (keydown.enter)="search()"
            [placeholder]="'MEDIA_LIBRARY.SEARCH_PLACEHOLDER' | translate"
            class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <button type="button" (click)="search()"
            class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 px-4 rounded-lg flex items-center gap-1">
            <mat-icon class="text-[16px]">search</mat-icon> {{ 'COMMON.SEARCH' | translate }}
          </button>
        </div>
      </div>

      <div class="px-6 py-5 overflow-y-auto flex-1">
        @if (isLoading()) {
          <p class="text-center text-sm text-gray-400 py-10">{{ 'COMMON.LOADING' | translate }}</p>
        } @else if (items().length === 0) {
          <p class="text-center text-sm text-gray-400 py-10">{{ 'MEDIA_LIBRARY.EMPTY' | translate }}</p>
        } @else {
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
            @for (file of items(); track file.path) {
              <button type="button" (click)="choose(file)"
                class="group border border-gray-200 rounded-lg overflow-hidden hover:border-emerald-500 hover:shadow-md transition-all text-left">
                <div class="aspect-square bg-gray-50 flex items-center justify-center overflow-hidden">
                  <img [src]="resolveUrl(file.path)" [alt]="file.fileName" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                </div>
                <div class="px-2 py-1.5">
                  <p class="text-xs text-gray-600 truncate" [title]="file.fileName">{{ file.fileName }}</p>
                </div>
              </button>
            }
          </div>
        }
      </div>

      <div class="flex items-center justify-between px-6 py-3 border-t border-gray-100 bg-gray-50/50">
        <button type="button" (click)="prevPage()" [disabled]="page() <= 1"
          class="text-sm font-medium text-gray-600 disabled:opacity-40 hover:text-emerald-600 flex items-center gap-1">
          <mat-icon class="text-[18px]">chevron_left</mat-icon> {{ 'MEDIA_LIBRARY.PREV' | translate }}
        </button>
        <span class="text-xs text-gray-400">{{ items().length }} / {{ total() }}</span>
        <button type="button" (click)="nextPage()" [disabled]="page() * pageSize >= total()"
          class="text-sm font-medium text-gray-600 disabled:opacity-40 hover:text-emerald-600 flex items-center gap-1">
          {{ 'MEDIA_LIBRARY.NEXT' | translate }} <mat-icon class="text-[18px]">chevron_right</mat-icon>
        </button>
      </div>
    </div>
  </div>
}
