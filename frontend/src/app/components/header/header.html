<header class="bg-white shadow-sm h-[60px] flex items-center justify-between px-4 z-10 shrink-0">
  <button (click)="layout.toggleSidebar()" class="p-2 mr-2 rounded-lg hover:bg-gray-100 text-gray-600 transition-colors focus:outline-none">
    <span class="material-icons mt-1">menu</span>
  </button>
  
  <div class="flex items-center space-x-3">
    <!-- Language Dropdown -->
    <div class="relative">
      <button (click)="layout.langOpen.set(!layout.langOpen()); layout.userMenuOpen.set(false)" class="flex items-center space-x-2 px-3 py-1.5 rounded-md hover:bg-gray-100 border border-gray-200 transition-colors">
        <img [src]="currentFlag()" class="w-4 h-[11px] rounded-[1px] object-cover" alt="lang">
        <span class="text-sm font-medium text-gray-700">{{ currentLang() }}</span>
      </button>
      
      @if (layout.langOpen()) {
        <div class="absolute right-0 mt-2 w-40 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50">
          <button (click)="setLang('VI', 'https://upload.wikimedia.org/wikipedia/commons/2/21/Flag_of_Vietnam.svg')" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center space-x-3 text-sm text-gray-700">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/21/Flag_of_Vietnam.svg" class="w-4 h-[11px] rounded-[1px] object-cover" alt="VI">
            <span>Tiếng Việt</span>
          </button>
          <button (click)="setLang('EN', 'https://upload.wikimedia.org/wikipedia/commons/a/a4/Flag_of_the_United_States.svg')" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center space-x-3 text-sm text-gray-700">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a4/Flag_of_the_United_States.svg" class="w-4 h-[11px] rounded-[1px] object-cover" alt="EN">
            <span>English</span>
          </button>
        </div>
      }
    </div>

    <!-- User Menu -->
    <div class="relative ml-2">
      <button (click)="layout.userMenuOpen.set(!layout.userMenuOpen()); layout.langOpen.set(false)" class="flex items-center space-x-3 focus:outline-none p-1 rounded-full hover:bg-gray-50 transition-colors">
        <div class="hidden sm:block text-right">
          <div class="text-sm font-bold text-gray-800 leading-tight">{{ user?.name }}</div>
          <div class="text-[11px] text-gray-500 leading-tight">{{ user?.role }}</div>
        </div>
        <img src="https://ui-avatars.com/api/?name=Admin&bg=0D6EFD&color=fff" class="w-9 h-9 rounded-full border border-gray-200 shadow-sm" alt="User">
      </button>

      @if (layout.userMenuOpen()) {
        <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-100 py-1 z-50">
          <a routerLink="/admin/profile" (click)="layout.userMenuOpen.set(false)" class="px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 flex items-center transition-colors">
            <span class="material-icons mr-3 text-blue-500 text-[20px]">account_circle</span> 
            Thông tin cá nhân
          </a>
          <a routerLink="/admin/change-password" (click)="layout.userMenuOpen.set(false)" class="px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 flex items-center transition-colors">
            <span class="material-icons mr-3 text-emerald-500 text-[20px]">lock_reset</span> 
            Đổi mật khẩu
          </a>
          <div class="border-t border-gray-100 my-1"></div>
          <button (click)="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center transition-colors">
            <span class="material-icons mr-3 text-[20px]">logout</span> 
            Thoát
          </button>
        </div>
      }
    </div>
  </div>
</header>
